packages:
  - "apps/*"
  - "packages/*"

minimumReleaseAge: 10080

allowBuilds:
  esbuild: true
  sharp: false
  ttf2woff2: true
  unrs-resolver: false
  workerd: true

minimumReleaseAgeExclude:
  - esbuild
  - "@esbuild/*"

overrides:
  esbuild: 0.28.1
  file-type: ">=21.3.1"
  undici: ">=7.28.0"
  ws: ">=8.21.0"
  yaml: ">=2.8.3"

patchedDependencies:
  prettier-plugin-astro: apps/site/patches/prettier-plugin-astro.patch
  prettier-plugin-tailwindcss: apps/site/patches/prettier-plugin-tailwindcss.patch
