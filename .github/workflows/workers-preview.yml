# Fallback PR preview via wrangler versions upload (does not touch production).
# Needs repo secret: CLOUDFLARE_API_TOKEN
# Prefer Cloudflare Workers Builds non-prod branch builds when they actually run.

name: Workers PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      alias:
        description: "Preview alias override (e.g. pr-82); defaults to the branch-derived alias"
        required: false
        type: string

concurrency:
  group: workers-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Derive preview alias
        id: alias
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ALIAS="pr-${{ github.event.pull_request.number }}"
          elif [ -n "${{ inputs.alias }}" ]; then
            ALIAS=$(printf '%s' "${{ inputs.alias }}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//; s/^(.{48}).*/\1/')
          else
            BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
            ALIAS=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//; s/^(.{48}).*/\1/')
          fi
          echo "alias=$ALIAS" >> "$GITHUB_OUTPUT"
          echo "shader_url=https://${ALIAS}-connect-shader.off-brand.workers.dev/" >> "$GITHUB_OUTPUT"
          echo "site_url=https://${ALIAS}-connect-2026-site.off-brand.workers.dev/connect/" >> "$GITHUB_OUTPUT"
          echo "Shader preview: https://${ALIAS}-connect-shader.off-brand.workers.dev/"
          echo "Site preview: https://${ALIAS}-connect-2026-site.off-brand.workers.dev/connect/"

      - name: Upload Worker version (preview alias)
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 944ca70087298faa2e84783db46162c5
          PREVIEW_ALIAS: ${{ steps.alias.outputs.alias }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing; no PR preview was uploaded."
            exit 1
          fi
          pnpm run preview:upload

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const shaderUrl = '${{ steps.alias.outputs.shader_url }}';
            const siteUrl = '${{ steps.alias.outputs.site_url }}';
            const alias = '${{ steps.alias.outputs.alias }}';
            const body = [
              '## Workers preview URLs',
              '',
              `**Refresh site:** ${siteUrl}`,
              `**Shader tool:** ${shaderUrl}`,
              '',
              `Preview alias: \`${alias}\` (not production).`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes('## Workers preview URL'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
