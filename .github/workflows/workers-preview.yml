# Fallback PR preview via wrangler versions upload (does not touch production).
# Needs repo secret: CLOUDFLARE_API_TOKEN
# Prefer Cloudflare Workers Builds non-prod branch builds when they actually run.

name: Workers PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: workers-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Derive preview alias
        id: alias
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          ALIAS=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//; s/^(.{48}).*/\1/')
          echo "alias=$ALIAS" >> "$GITHUB_OUTPUT"
          echo "url=https://${ALIAS}-connect-shader.off-brand.workers.dev/" >> "$GITHUB_OUTPUT"
          echo "Branch preview: https://${ALIAS}-connect-shader.off-brand.workers.dev/"

      - name: Upload Worker version (preview alias)
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 944ca70087298faa2e84783db46162c5
          PREVIEW_ALIAS: ${{ steps.alias.outputs.alias }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::notice::No CLOUDFLARE_API_TOKEN — skipping GitHub Actions preview upload."
            echo "Prefer Cloudflare Workers Builds (Branch control → Builds for non-production branches)."
            echo "Expected branch preview: ${{ steps.alias.outputs.url }}"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pnpm run preview:upload
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.upload.outputs.skipped != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.alias.outputs.url }}';
            const alias = '${{ steps.alias.outputs.alias }}';
            const body = [
              '## Workers preview URL',
              '',
              `**Branch preview:** ${url}`,
              `**Client:** ${url}client.html`,
              '',
              `Alias \`${alias}-connect-shader\` (not production).`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes('## Workers preview URL'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
