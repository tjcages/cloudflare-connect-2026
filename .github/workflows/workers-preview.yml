# Cloudflare Workers PR preview (versions upload)

# Posts a branch-aliased preview URL without promoting production.
# Requires repo secret CLOUDFLARE_API_TOKEN (Workers Edit permission).
# Prefer native Workers Builds non-production branch builds when available —
# this workflow is a fallback when the CF GitHub check stays queued with 0 runs.

name: Workers PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: workers-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Derive preview alias
        id: alias
        run: |
          BRANCH="${{ github.head_ref }}"
          ALIAS=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//; s/^(.{48}).*/\1/')
          echo "alias=$ALIAS" >> "$GITHUB_OUTPUT"
          echo "url=https://${ALIAS}-connect-shader.off-brand.workers.dev/" >> "$GITHUB_OUTPUT"

      - name: Upload Worker version (preview alias)
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 944ca70087298faa2e84783db46162c5
          PREVIEW_ALIAS: ${{ steps.alias.outputs.alias }}
        run: pnpm run preview:upload

      - name: Comment preview URL on PR
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.alias.outputs.url }}';
            const alias = '${{ steps.alias.outputs.alias }}';
            const body = [
              '## Workers preview URL',
              '',
              `**Branch preview:** ${url}`,
              `**Client:** ${url}client.html`,
              '',
              `Alias \`${alias}-connect-shader\` (not production).`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes('## Workers preview URL'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Missing CLOUDFLARE_API_TOKEN
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "::warning::Add repo secret CLOUDFLARE_API_TOKEN, or enable Workers Builds → Branch control → Builds for non-production branches."
          echo "Expected branch preview: ${{ steps.alias.outputs.url }}"
          exit 1
