name: Deploy connect-shader

# Keeps the Cloudflare Worker `connect-shader` in sync with this feature branch.
on:
  push:
    branches:
      - feat/lab-connect-shader-tool
  workflow_dispatch: {}

env:
  HUSKY: "0"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @necatikcl/stripes-engine build

      - run: pnpm --filter lab build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/lab
          command: deploy
